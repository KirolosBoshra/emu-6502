FEATURES {
    STARTADDRESS: default = $0400;
}
SYMBOLS {
    __STACKSIZE__:  type = weak, value = $0100;
    __STACKSTART__: type = weak, value = $7E00;
    __ZPSTART__:    type = weak, value = $0080;
}
MEMORY {
    FULL: file = %O, start = $0000, size = $10000, fill = yes;
}
SEGMENTS {
    ZEROPAGE: load = FULL, type = zp,  start = $0080;
    STARTUP:  load = FULL, type = ro,  start = %S, optional = yes;
    LOWCODE:  load = FULL, type = ro,  optional = yes;
    ONCE:     load = FULL, type = ro,  optional = yes;
    CODE:     load = FULL, type = ro;
    RODATA:   load = FULL, type = ro;
    DATA:     load = FULL, type = rw;
    BSS:      load = FULL, type = bss, start = $7D00, define = yes;
    VECTORS:  load = FULL, type = ro,  start = $FFFA;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
